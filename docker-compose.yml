services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Default: "Data Source=/app/data/habittracker.db"
    volumes:
      - backend_data:/app/data

  integration-go:
    build:
      context: ./integration-go
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      BACKEND_URL: "http://backend:8080"
      GO_HTTP_ADDR: ":8081"
      POLL_INTERVAL_SECONDS: "30"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-habit-tracker@example.local}"
    depends_on:
      - backend

volumes:
  backend_data:
