services:
  habittracker-api:
    build:
      context: ./backend/HabitTracker.Api
      dockerfile: Dockerfile
    container_name: habittracker-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DATA_FILE: /app/data/habittracker.json
    ports:
      - "8080:8080"
    volumes:
      - habittracker-data:/app/data

  integration-go:
    build:
      context: ./integration-go
      dockerfile: Dockerfile
    container_name: habittracker-integration-go
    depends_on:
      - habittracker-api
    environment:
      BACKEND_URL: http://habittracker-api:8080
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_POLL_TIMEOUT_SECONDS: 25
    restart: unless-stopped

volumes:
  habittracker-data:
